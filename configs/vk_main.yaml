# Minimal config for random-design pipeline (n+2 BDDL files, temporal at start/stop, BO heatmap).
# Run: python scripts/launcher.py --config configs/vk_main.yaml --random-design

# --- Base task ---
base_bddl_file: libero/libero/bddl_files/libero_10/KITCHEN_SCENE4_put_the_black_bowl_in_the_bottom_drawer_of_the_cabinet_and_close_it.bddl
base_prompt: put the black bowl in the bottom drawer of the cabinet and close it

model: openvla
task_suite_name: libero_10
device: cuda:0
cache_dir: /home/hice1/vkulkarni46/scratch/huggingface

action_scale: 1.0
num_demos: 2
noise_std: 0.001

# --- Perturbation type and object ---
# type: move = bounds are deltas (m) from object initial position. type: distract = bounds are actual (x,z) coords (m).
random_design:
  type: move
  n_design: 20
  seed: 1
  bounds_x: [-0.1, 0.1]
  bounds_z: [-0.1, 0.1]
  object_names: ["akita_black_bowl_1"]
  uniform: true

# --- Temporal window (when perturbation is applied during recording) ---
perturbation_start_step: 0
perturbation_stop_step: 99999
max_move_m: 0.05

# --- BDDL init box width (m) per object ---
perturbations:
  bddl_spatial:
    init_range_m: 0.001
    max_move_m: 0.05

# For type: distract only
# hidden_objects:
#   - name: distractor_1
#     type: akita_black_bowl

# --- SLURM ---
slurm:
  max_concurrent_jobs: 20
  job_params:
    partition: "coc-gpu"
    account: "coc"
    time: "02:00:00"
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 4
    mem: 16G
    gpus: 1
    constraint: null
    blacklisted_nodes: ["atl1-1-01-002-8-0"]
  conda_env: /home/hice1/vkulkarni46/scratch/envs/xAI
  module_load: ["anaconda3/2023.03", "cuda/12.6.1"]
  job_name_prefix: "vla_record"
  poll_interval: 30

run_base_dir: null

# Videos are rendered inside record.py; skip separate playback/render step.
render_videos: false

# --- Evaluation (for heatmap) ---
evaluation:
  enabled: true
  metric_weights:
    w_result: 1.0
    w_time: 1.0
    w_trajectory: 1.0
  trajectory_weights: [1.0, 1.0, 1.0, 0, 0, 0, 0, 0]
  output_formats:
    - json
    - hdf5
