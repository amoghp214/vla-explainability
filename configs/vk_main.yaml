# Minimal config for the pipeline (random-design + temporal, single workflow).
# Run: python scripts/launcher.py --config configs/vk_main.yaml

# --- Base task ---
base_bddl_file: libero/libero/bddl_files/libero_10/KITCHEN_SCENE4_put_the_black_bowl_in_the_bottom_drawer_of_the_cabinet_and_close_it.bddl
base_prompt: put the black bowl in the bottom drawer of the cabinet and close it

model: openvla
task_suite_name: libero_10
device: cuda:0
cache_dir: /home/hice1/vkulkarni46/scratch/huggingface

action_scale: 1.0
num_demos: 2
noise_std: 0.001

# --- Perturbation type and object ---
# type: move = bounds are deltas (m) from object initial position. type: distract = bounds are actual (x,y) coords (m).
random_design:
  type: move
  n_design: 20
  seed: 1
  bounds_x: [-0.1, 0.1]
  bounds_y: [-0.1, 0.1]
  object_names: ["akita_black_bowl_1"]
  uniform: true

# --- Temporal (chunk-based): when perturbation is applied during recording ---
# num_chunks divides the rollout into chunks; each design point samples a chunk index.
# Frames per chunk = max_rollout_frames // num_chunks (last chunk may have fewer).
# Optional: set max_rollout_frames; if omitted, derived from task_suite_name.
temporal_perturbation:
  num_chunks: 10
  # max_rollout_frames: 520   # optional; default from task_suite (e.g. libero_10 -> 520)

# Top-down birdview PNGs (unperturbed run only): saved under <run_dir>/top-down-frames/
# Policy cameras stay 256×256; exports use offscreen render + matplotlib axes (world x,y in meters).
top_down_camera:
  birdview_width: 1024
  birdview_height: 1024
  fovy_deg: 1.0
  camera_z: 58.0
  camera_x: 0.0
  camera_y: 0.0
  # World XY extent vs table plane (m). Omit to auto-estimate from *table* geoms.
  # table_plane_z: 0.85
  plot_distance_axes: true
  figure_dpi: 120

# --- BDDL init box width (m) per object ---
perturbations:
  bddl_spatial:
    init_range_m: 0.001

# For type: distract only
# hidden_objects:
#   - name: distractor_1
#     type: akita_black_bowl

# --- SLURM ---
slurm:
  max_concurrent_jobs: 20
  job_params:
    partition: "coc-gpu"
    account: "coc"
    time: "02:00:00"
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 4
    mem: 16G
    gpus: 1
    constraint: null
    blacklisted_nodes: ["atl1-1-01-002-8-0"]
  conda_env: /home/hice1/vkulkarni46/scratch/envs/xAI
  module_load: ["anaconda3/2023.03", "cuda/12.6.1"]
  job_name_prefix: "vla_record"
  poll_interval: 30

run_base_dir: null

# MP4s are written by record.py to each YAML's record_path (results/videos/<id>.mp4).

# --- Evaluation (for heatmap) ---
evaluation:
  enabled: true
  metric_weights:
    w_result: 1.0
    w_time: 1.0
    w_trajectory: 1.0
  trajectory_weights: [1.0, 1.0, 1.0, 0, 0, 0, 0, 0]
  output_formats:
    - json
    - hdf5
