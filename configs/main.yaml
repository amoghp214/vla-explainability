# Main configuration file for the pipeline (random-design + temporal).
# The launcher (scripts/launcher.py) uses only the random_design section and temporal settings below.
# Run: python scripts/launcher.py --config configs/main.yaml

# =============================================================================
# Base Task Configuration
# =============================================================================
model: openvla
task_suite_name: libero_10
device: cuda:0
cache_dir: /home/hice1/apalasamudram6/scratch/.hf_cache

# Original BDDL file (will be used as base for perturbations)
# base_bddl_file: libero/libero/bddl_files/libero_90/KITCHEN_SCENE1_put_the_black_bowl_on_the_plate.bddl
# base_prompt: put the black bowl on the plate
base_bddl_file: libero/libero/bddl_files/libero_10/KITCHEN_SCENE4_put_the_black_bowl_in_the_bottom_drawer_of_the_cabinet_and_close_it.bddl
base_prompt: put the black bowl in the bottom drawer of the cabinet and close it

# Recording parameters
action_scale: 1.0
num_demos: 5  # Number of demonstrations to record per perturbation
noise_std: 0.001  # Gaussian noise std deviation for action deltas

# =============================================================================
# Perturbation Configuration
# =============================================================================
perturbations:
  # Number of perturbations to generate
  num_perturbations: 6
  
  # Perturbation types to generate
  # Options: bddl_spatial, language
  types:
    - bddl_spatial
    # - language
  
  # For BDDL spatial perturbations
  bddl_spatial:
    # Init placement box: side length (m) for each object region. Small (e.g. 0.001) for minimal variation.
    init_range_m: 0.001
    # List of perturbation combinations to apply
    # Each entry is a dict with perturbation type and target objects
    perturbation_specs:
      - type: move
        objects: ["akita_black_bowl_1"]
        max_move_m: 0.05 # This is the max move distance for the "move" perturbation type (in meters)
      # - type: reorient
      #   objects: ["akita_black_bowl_1", "wine_bottle_1"]
      # - type: color
      #   objects: ["akita_black_bowl_1"]
      # - type: distractor
      #   count: 1
      # - type: replace
      #   objects: ["akita_black_bowl_1"]
      - type: control
        objects: []
  
  # For language perturbations (if enabled)
  language:
    # Will use generate_perturbations from explainability/perturbations/language/
    # All standard perturbations will be generated

# =============================================================================
# Temporal (mid-rollout) perturbations — used by all launcher flows
# =============================================================================
# Applied during recording by record.py. Collisions are resolved automatically
# (stacking or placement inside open drawers/cabinets). Move and distract supported
# at any timestep.
#
# Timing:
#   - Full duration of rollout: set start_step to 0 (first frame) and end_step to
#     a value >= episode length (e.g. 99999) so the perturbation is never reverted.
#   - Exact timestep window: set start_step and end_step to the desired frame range.
#     At start_step the perturbation is applied; at end_step+1 it is reverted.
#
# hidden_objects: required for distractor/replace types (pre-loaded off-screen).
#   Uncomment and add entries when using those types.
# hidden_objects:
#   - name: moka_pot_999
#     type: moka_pot
#   - name: milk_777
#     type: milk

temporal_perturbations:
  # Example: move object for full rollout (first frame to end of episode).
  # Uses start_step: 0 and end_step: 99999 so perturbation is never reverted.
  - type: move
    obj_name: akita_black_bowl_1
    start_step: 0      # first frame
    end_step: 99999    # effectively "until episode end"
    delta_xy: [0.06, 0.0]
    max_move_m: 0.05

  # Example: move at a specific timestep window (uncomment to use).
  # - type: move
  #   obj_name: akita_black_bowl_1
  #   start_step: 50
  #   end_step: 150
  #   delta_xy: [0.04, 0.02]
  #   max_move_m: 0.05

  # Example: distractor at a specific timestep (requires hidden_objects above).
  # - type: distractor
  #   distractor_obj_name: moka_pot_999
  #   start_step: 80
  #   end_step: 200
  #   distractor_xy: [0.10, -0.10]

# =============================================================================
# SLURM Job Configuration
# =============================================================================
slurm:
  # Maximum number of simultaneous jobs
  max_concurrent_jobs: 40
  
  # Job parameters
  job_params:
    partition: "coc-gpu"  # Optional - can omit for auto-select
    account: "coc"      # Optional - can omit for default account
    time: "2:00:00"
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 4
    mem: 16G
    gpus: 1
    # gpu_type: "V100" #TODO: make this more flexible (e.g. allow A100, etc.)
    constraint: null  # Optional: "V100-32GB", "A100-80GB", etc.
    blacklisted_nodes: ["atl1-1-01-002-8-0"]  # Optional: List of node names to exclude from job allocation
                           # Example: ["node001", "node002"] or ["node[001-005]"]
                           # Uses SLURM --exclude flag to prevent jobs from running on problematic nodes
  
  # Environment setup
  conda_env: /home/hice1/apalasamudram6/scratch/.conda/envs/vla-e
  module_load: ["anaconda3/2023.03", "cuda/12.6.1"]  # List of modules to load (e.g., ["cuda/11.8"])
  
  # Job script template variables
  job_name_prefix: "vla_record"
  
  # Polling interval for checking job status (seconds)
  poll_interval: 30

# =============================================================================
# Directory Structure
# =============================================================================
# Base directory for runs (will be created in scratch folder)
# If not set, will use $SCRATCH/vla-explainability-runs
run_base_dir: null

# =============================================================================
# Bayesian Optimization (optional)
# =============================================================================
# Used by: python -m explainability.vla_bayesian_optimization --config configs/main.yaml
# bayesian_optimization:
#   pbounds: { dx: [-0.05, 0.05], dz: [-0.05, 0.05] }
#   object_names: ["akita_black_bowl_1"]
#   batch_size: 2
#   init_points: 5
#   n_iter: 10

# =============================================================================
# Random design (temporal + BoTorch heatmap)
# =============================================================================
# With --random-design: n+2 BDDL files (unperturbed, control, rd_0..rd_{n-1}). Each rd_i uses
# its own BDDL and temporal perturbation in a randomly sampled chunk (start/end step from chunk).
random_design:
  type: move
  n_design: 120
  seed: 100
  bounds_x: [-0.1, 0.1]
  bounds_y: [-0.1, 0.1]
  object_names: ["akita_black_bowl_1"]
  uniform: true

# Chunk-based temporal: num_chunks divides rollout; each design point samples (x, z, chunk).
# Frames per chunk = max_rollout_frames // num_chunks (last chunk may have fewer).
temporal_perturbation:
  num_chunks: 10
  # max_rollout_frames: 520   # optional; default from task_suite_name

# Top-down birdview PNGs (unperturbed run only): <run_dir>/top-down-frames/
# Exports: offscreen render + matplotlib axes (world x,y in meters on table plane).
top_down_camera:
  birdview_width: 1024
  birdview_height: 1024
  fovy_deg: 1.0
  camera_z: 58.0
  camera_x: 0.0
  camera_y: 0.0
  # table_plane_z: 0.85   # optional; omit for auto from *table* geoms
  plot_distance_axes: true
  figure_dpi: 120

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  # Enable evaluation after all jobs complete
  enabled: true
  visualize_trajectories: false
  
  # Metric weights for VLA metrics
  metric_weights:
    w_result: 1.0
    w_time: 1.0
    w_trajectory: 1.0
  
  # Trajectory weight matrix (8D: xyz, quat, gripper)
  trajectory_weights: [1.0, 1.0, 1.0, 0, 0, 0, 0, 0]
  
  # Output formats
  output_formats:
    - json
    - hdf5

# Videos: record.py writes MP4s to record_path in each generated record YAML (no separate playback step).